<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      .login-card {
        width: 100%;
        max-width: 400px;
        padding: 2rem;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      .login-card h1 {
        margin: 0 0 1.5rem;
        font-size: 1.5rem;
        text-align: center;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
        margin-bottom: 1rem;
      }

      .field label {
        font-size: 0.875rem;
        font-weight: 600;
      }

      .field input {
        width: 100%;
        padding: 0.625rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }

      .field input:focus {
        outline: 2px solid #2563eb;
        outline-offset: 1px;
        border-color: #2563eb;
      }

      button[type="submit"] {
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button[type="submit"]:hover {
        background: #1d4ed8;
      }

      @media (max-width: 480px) {
        body {
          align-items: flex-start;
          padding-top: 2rem;
        }

        .login-card {
          padding: 1.5rem;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <h1>Entrar</h1>
      <!-- Sem ação ao enviar: o onsubmit impede o envio/recarregamento da página. -->
      <form id="login-form" novalidate onsubmit="return false;">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>
        <button type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
